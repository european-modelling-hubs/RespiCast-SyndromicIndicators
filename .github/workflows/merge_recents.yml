name: MergeRecents 

on:
  # Automated and manual runs are owned by surveillance.yml.
  workflow_call:

permissions:
  contents: write

jobs:

  merge_recents_job:
    if: github.repository_owner == 'european-modelling-hubs'
    runs-on: ubuntu-latest
    steps:

    # Checkout the python tools repo
    # -------------------------------------------      
    - name: checkout python tools repo
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        repository: 'european-modelling-hubs/hub-tools'
        ref: 'main'
        path: './tools/'

    # Checkout the data repository
    # -------------------------------------------      
    - name: checkout data repo
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        repository: 'european-modelling-hubs/RespiCast-SyndromicIndicators'
        ref: 'main'
        path: './repo/'


    
    # Run Pyton code
    # -------------------------
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10' 
    
    # - run: pip install pandas==1.2.5 numpy==1.22.4
    
    - name: do the merge
      id: do_the_merge
      env:
        disease_name: ${{ vars.DISEASE_NAME }}
        
      run: |
        # ERVISS is mandatory; FluID files are optional and may be unchanged.
        for target in ILI ARI; do
          test -s "./repo/target-data/ERVISS/latest-${target}_incidence.csv"
        done
        python ./tools/code/merge_recent_data_ILI_ARI.py --repository "./repo" --source_list "ERVISS FluID"

    - name: Commit data repo changes
      uses: EndBug/add-and-commit@v9
      with: 
          cwd: './repo'
          message: "Update data storage"
          default_author: github_actions
          push: true
