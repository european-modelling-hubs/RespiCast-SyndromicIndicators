name: "ImportTruthErviss"
on:
  # Automated and manual runs are owned by surveillance.yml.
  workflow_call:
    inputs:
      snapshot_date:
        required: true
        type: string

permissions:
  contents: write

jobs:

  import_truth_job:
    if: github.repository_owner == 'european-modelling-hubs'
    runs-on: ubuntu-latest
    outputs:
      changed_files:  ${{ steps.import_truth.outputs.imported_files }} 

    steps:

    # Checkout the python tools repo
    # -------------------------------------------      
    - name: checkout python tools repo
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        repository: 'european-modelling-hubs/hub-tools'
        ref: 'main'
        path: './tools/'

    # Checkout the data repository
    # -------------------------------------------      
    - name: checkout data repo
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        repository: 'european-modelling-hubs/RespiCast-SyndromicIndicators'
        ref: 'main'
        path: './repo/'
    
    # Run Pyton code
    # -------------------------
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10' 
    
    - run: pip install pycountry isoweek
    
    - name: Import Truth
      id: import_truth
      env:
        SNAPSHOT_DATE: ${{ inputs.snapshot_date }}
      run: |
        python ./tools/code/import_truth_ILI_ARI.py --hub_path ./repo --snapshot_date "$SNAPSHOT_DATE"

    - name: Commit data repo changes
      uses: EndBug/add-and-commit@v9
      with: 
          cwd: './repo'
          message: "Updating Truth Data repo ..."
          default_author: github_actions
          push: true

  call-persisting-wf:
    needs: import_truth_job
    uses: ./.github/workflows/persist_changes.yml
    with:
      changes-list: ${{ needs.import_truth_job.outputs.changed_files }}

    secrets:
      envPAT: ${{ secrets.GITHUB_TOKEN }} 
