methods: "Simons-297M, an open pretrained time series foundation model, zero-shot and univariate on each country's series. Its 9 deciles are extended to the 23 levels by a fixed interpolation and tail rule."
data_inputs: "ECDC ERVISS ILI and ARI incidence, taken only from this repository's target-data snapshots published before each round. Each country's own series is the only input; no covariates and no other live data. Simons is a pretrained model used zero-shot and is not fine-tuned on hub data."
license: "CC-BY-4.0"
website_url: "https://github.com/Abel-ai-lab/Simons"
citation: "Abel AI Lab (2026). Simons - Building Open Time Series Foundation Models through Auto-Research. Release post https://abel.ai/research/introducing-simons/, code https://github.com/Abel-ai-lab/Simons (v0.1.0), weights https://huggingface.co/abel-lab/Simons-297M"
methods_long: "Simons-297M (weights abel-lab/Simons-297M on Hugging Face, OpenMDW-1.1; code github.com/Abel-ai-lab/Simons v0.1.0, Apache-2.0) is used zero-shot with its released default settings and is not fine-tuned on any hub data. For each target and country the input is the weekly series in the latest target-data snapshot of this repository, from its first to its last reported week, with unreported weeks left as missing. Nothing is filled in and no other data are added. The model forecasts 12 weekly steps ahead from each series' own last reported week, so a country that reports late is forecast further ahead. A series whose last reported week is more than 12 steps before horizon 4, or with fewer than 52 reported weeks, is skipped. Horizons 1 to 4 are submitted. The model outputs the 9 deciles 0.1 to 0.9. The other 14 levels follow one fixed rule. The levels between deciles (0.15, 0.25 and so on) come from a monotone cubic interpolation of the deciles. The levels below 0.1 and above 0.9 continue each tail exponentially, with a scale set by the two outer deciles on that side, so that level 0.05 lies one outer-decile spacing beyond the outer decile, 0.025 two and 0.01 about 3.3. All values are clipped at zero. The median row repeats the 0.5 quantile. The rule was chosen on a replay of the 2024/25 and 2025/26 rounds from the snapshots available at each round, by mean WIS on the 23 levels and tail coverage. The same settings are used every week, and any change will be noted here with its date."
