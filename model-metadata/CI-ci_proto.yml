methods: "ci-proto, a time-series foundation model, used with its released settings and not fine-tuned on hub data. For each target, all countries' series go into one call."
data_inputs: "ECDC ERVISS and WHO FluID ILI and ARI incidence, taken only from this repository's target-data snapshots published before each round. No other data."
