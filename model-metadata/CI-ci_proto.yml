website_url: "https://github.com/continuousintelligence/ci"
citation: "Continuous Intelligence (2026). ci-proto. https://huggingface.co/ContinuousIntelligence/ci-proto"
methods_long: "ci-proto (weights ContinuousIntelligence/ci-proto on Hugging Face, revision ee3031351a151e3f6febf8c62b53e6ea1008bef6) is used with its released settings and is not fine-tuned on any hub data. For each target, the weekly series of every country in the latest target-data snapshots of this repository go into a single call, as raw rates per 100,000 from each series' first reported week, with unreported weeks left as missing. The model also receives each week's date, from which it derives week of year and holiday features. Countries with no report in the last 8 weeks are skipped. Horizons 1 to 4 are submitted. The model outputs the 9 quantiles 0.1 to 0.9. The other 14 levels are linear in log(1 + value) against the normal score of the level, with the end segments continued into the tails, and the median row repeats the 0.5 quantile. The same settings are used every week. On a replay of every round from 6 August 2025 to 18 November 2026, using only the snapshots available at each round, ci-proto's total WIS was 0.72 (90% interval 0.68-0.77) of the hub ensemble's, comparing only the countries and weeks that both forecast."
