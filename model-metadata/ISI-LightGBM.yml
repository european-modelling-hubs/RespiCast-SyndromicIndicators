methods: |
  The forecasting model is a two-stage LightGBM pipeline: a first LightGBM stage predicts the central value, and a second LightGBMLSS stage approximates the remaining predictive quantiles.
  Both stages are trained jointly across countries on a pooled panel, which induces cross-country dependence. 
  We also include, as predictors, Google Search Trends volumes for query topics related to ILI and ARI symptoms, treatments, and care-seeking behaviour.
data_inputs: ECDC ERVISS, FluID WHO
